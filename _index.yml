indexpage:
  title: NetApp Volume Caching
  lead: El almacenamiento en caché de volumen proporciona un volumen persistente y
    escribible en un lugar remoto. Puede utilizar el almacenamiento en caché de volumen
    para acelerar el acceso a los datos o para descargar el tráfico de volúmenes con
    mucho acceso. Los volúmenes de caché son ideales para cargas de trabajo de lectura
    intensiva, especialmente cuando los clientes necesitan acceder a los mismos datos
    repetidamente.
